name: Deploy Cloud Functions (manual)

# Manual only — Functions are never deployed automatically. Trigger from the
# Actions tab ("Run workflow"). Nothing else in this repo deploys them: the
# pages workflow only publishes the SPA, and firebase-functions-pull-request.yml
# only builds and lints, so before this existed the functions had to be deployed
# from a laptop.
on:
  workflow_dispatch:

permissions:
  contents: read

# Don't let two manual function deploys race each other.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  PROJECT_ID: cksc-platform
  # Pinned to match the Legislation deploy workflow: 15.22.x regressed
  # service-account auth (upstream firebase-tools #10692). 15.21.0 is the last
  # known-good version.
  FIREBASE_TOOLS_VERSION: '15.21.0'

jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to 24.16.0 (a 24.16.x patch), NOT 24.17+. Newer Node patches
          # trip a node-fetch@2 gzip bug (nodejs/node#63989) that makes
          # firebase-tools' OAuth token exchange fail with "Premature close",
          # mislabelled "Failed to authenticate, have you run firebase login?".
          # Maintainer-recommended workaround (firebase-tools#10692): use Node
          # 22.22.x or 24.16.x. Functions require Node 24, so 24.16.0 it is.
          node-version: '24.16.0'
          cache: 'yarn'
          # There are two lockfiles in this repo; the functions deploy only
          # cares about its own.
          cache-dependency-path: firebase/functions/yarn.lock

      - name: Cache packages
        uses: actions/cache@v3
        with:
          key: ${{ runner.os }}-functions-yarn-${{ hashFiles('firebase/functions/yarn.lock') }}
          path: firebase/functions/node_modules

      - name: Install functions dependencies
        # firebase.json's predeploy hooks shell out to `npm --prefix functions
        # run lint` and `... run build`, both of which need node_modules already
        # in place — the deploy step does not install anything itself.
        run: |
          cd firebase/functions
          yarn install --frozen-lockfile

      - name: Restore runtime service-account credential
        # The google-drive-uploader key is read at runtime by
        # firebase/functions/src/index.ts (keyFile: 'src/credential.json',
        # resolved against the deployed package root). It is gitignored and never
        # committed — it lives only as the FUNCTIONS_CREDENTIAL_JSON secret and is
        # materialised here so it ships with the deployed source. Written via env
        # (not inline) to keep the secret out of the command line and logs.
        #
        # Checked rather than assumed: an unset secret would write an empty file
        # and deploy a uploadAttachment that fails every Drive call at runtime.
        run: |
          if [ -z "$FUNCTIONS_CREDENTIAL_JSON" ]; then
            echo "::error::FUNCTIONS_CREDENTIAL_JSON is not set. uploadAttachment cannot authenticate to Google Drive without it."
            exit 1
          fi
          printf '%s' "$FUNCTIONS_CREDENTIAL_JSON" > firebase/functions/src/credential.json
        env:
          FUNCTIONS_CREDENTIAL_JSON: ${{ secrets.FUNCTIONS_CREDENTIAL_JSON }}

      - name: Write deploy service-account key
        # The Firebase CLI authenticates from a service-account key file pointed to by
        # GOOGLE_APPLICATION_CREDENTIALS. (google-github-actions/auth's credential
        # file isn't consumed by firebase-tools, which falls through to "firebase
        # login".) Written to RUNNER_TEMP, outside the repo, so it never ships with
        # the source.
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_CKSC_PLATFORM is not set."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CKSC_PLATFORM }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Deploy functions
        # firebase.json lives in firebase/, not at the repo root, and its
        # predeploy hooks (lint + tsc build) are relative to it, so the CLI has
        # to run from there.
        run: |
          cd firebase
          firebase deploy --only functions --project "$PROJECT_ID" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json

      - name: Remove deploy service-account key
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
